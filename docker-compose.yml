services:
  plc-mock:
    build: .
    restart: unless-stopped
    command: ["plcmock", "serve", "--config", "/app/config/example.yml"]
    ports:
      - "5000:5000/udp"   # Mitsubishi SLMP/MC 3E/4E binary
      - "9600:9600/udp"   # OMRON FINS/UDP
      - "1502:1502/udp"   # Modbus ADU over UDP (compatibility extension)
      - "15000:15000/udp" # custom ASCII plugin example
    volumes:
      - ./config:/app/config:ro
      - ./examples:/app/examples:ro
